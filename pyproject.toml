[project]
name = "scriptorium"
version = "0.1.0"
description = "The organ that reads a lifetime: manifest in -> Tape + Catalog + Codex + Certificate out"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
tokens = ["tiktoken>=0.7"]
# optional: --provider harness (DSH worker agents); lazy-imported in
# harness._default_factory — the default api path never needs it.
harness = ["deepseek-harness-sdk"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# untracked sibling subprojects with their own conventions, not scriptorium code
extend-exclude = ["amanuensis", "amanuensis-native"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
